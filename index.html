<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2EF">
<title>Cosas de Casa</title>

<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cosas de Casa">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..700,100&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #F3F2EF;
    --surface: #FFFFFF;
    --ink: #161616;
    --muted: #7C7B78;
    --line: #E7E5E1;
    --soft: #ECEAE6;
    --rojo: #D7263D;
}

* { box-sizing: border-box }

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

main {
    max-width: 480px;
    margin: 0 auto;
    padding: max(36px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
}

.marca {
    text-align: center;
    margin: 12px 0 34px;
}

.marca img {
    display: block;
    width: min(260px, 70vw);
    height: auto;
    margin: 0 auto 6px;
}

h1 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 100;
    font-weight: 650;
    font-size: 40px;
    letter-spacing: -.025em;
    line-height: 1.05;
}

.saludo {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
}

.saludo::first-letter { text-transform: uppercase }

.apps {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.app {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px 16px 16px;
    background: var(--surface);
    border-radius: 26px;
    color: inherit;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 28px -14px rgba(0,0,0,.22);
    transition: transform .15s, box-shadow .15s;
    animation: entrar .35s cubic-bezier(.2,.9,.3,1.1) backwards;
}

.app:nth-child(2) { animation-delay: .06s }

.app:nth-child(3) { animation-delay: .12s }

.icono-juego {
    display: grid;
    place-items: end center;
    width: 72px;
    height: 72px;
    flex-shrink: 0;
    overflow: hidden;
    border-radius: 50%;
    background: #FBE9EC;
    box-shadow: inset 0 0 0 3px var(--rojo), 0 6px 16px -8px rgba(0,0,0,.45);
}

.icono-juego svg {
    width: 50px;
    height: 72px;
    margin-bottom: -4px;
}

.app:hover { box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 14px 32px -14px rgba(0,0,0,.3) }
.app:active { transform: scale(.975) }

.app:focus-visible {
    outline: 2.5px solid var(--ink);
    outline-offset: 3px;
}

.app img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.45);
}

.app-texto {
    flex: 1;
    min-width: 0;
}

.app-texto strong {
    display: block;
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 100;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -.015em;
    line-height: 1.15;
}

.app-texto span {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 15px;
}

.flecha {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--soft);
    transition: background .15s, color .15s;
}

.app:hover .flecha,
.app:active .flecha {
    background: var(--rojo);
    color: #fff;
}

footer {
    margin-top: auto;
    padding-top: 40px;
    text-align: center;
    color: #A9A7A2;
    font-size: 13px;
}

footer span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 8px 2px;
    border-radius: 50%;
    background: var(--rojo);
    opacity: .7;
}

/* ---------- Muñecos que pasean ---------- */

main { padding-bottom: calc(170px + env(safe-area-inset-bottom)) }

.paseo {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 100%;
    max-width: 480px;
    height: calc(140px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 5;
}

.paseo::before {
    content: "";
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(26px + env(safe-area-inset-bottom));
    height: 2px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, #D9D6D0 0 14px, transparent 14px 22px);
}

.munyeco {
    position: absolute;
    left: 0;
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 60px;
    height: 86px;
    padding: 0;
    border: none;
    background: none;
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
    -webkit-user-select: none;
    user-select: none;
}

.munyeco svg {
    display: block;
    width: 60px;
    height: 86px;
    overflow: visible;
    transition: transform .2s;
}

.munyeco.izq svg { transform: scaleX(-1) }

.munyeco .cuerpo { animation: botar .45s ease-in-out infinite alternate paused }
.munyeco .pierna-a,
.munyeco .pierna-b { transform-box: fill-box; transform-origin: 50% 0 }
.munyeco .pierna-a { animation: paso .45s ease-in-out infinite alternate paused }
.munyeco .pierna-b { animation: paso .45s ease-in-out infinite alternate-reverse paused }

.munyeco.anda .cuerpo,
.munyeco.anda .pierna-a,
.munyeco.anda .pierna-b { animation-play-state: running }

.munyeco .ojos { transform-box: fill-box; transform-origin: 50% 50%; animation: parpadeo 4.2s infinite }
.munyeco:nth-child(2) .ojos { animation-delay: 1.3s }
.munyeco:nth-child(3) .ojos { animation-delay: 2.6s }
.munyeco:nth-child(4) .ojos { animation-delay: .7s }

.munyeco.salta svg { animation: saltar .55s cubic-bezier(.3, .7, .4, 1) }
.munyeco.izq.salta svg { animation-name: saltar-izq }

.bocadillo {
    position: absolute;
    left: 50%;
    bottom: 92px;
    padding: 7px 11px;
    border-radius: 14px;
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transform: translateX(-50%);
    animation: bocadillo .25s cubic-bezier(.2, .9, .3, 1.3);
    pointer-events: none;
}

.bocadillo::after {
    content: "";
    position: absolute;
    left: var(--pico, 50%);
    bottom: -5px;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    border-radius: 2px;
    background: var(--ink);
    transform: rotate(45deg);
}

@keyframes botar { to { transform: translateY(-2.5px) } }
@keyframes paso { from { transform: rotate(-22deg) } to { transform: rotate(22deg) } }
@keyframes parpadeo { 0%, 94%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
@keyframes saltar {
    0% { transform: translateY(0) scale(1, 1) }
    20% { transform: translateY(0) scale(1.12, .86) }
    55% { transform: translateY(-34px) scale(.94, 1.08) }
    85% { transform: translateY(0) scale(1.08, .92) }
    100% { transform: translateY(0) scale(1, 1) }
}
@keyframes saltar-izq {
    0% { transform: scaleX(-1) translateY(0) }
    20% { transform: scaleX(-1) translateY(0) scale(1.12, .86) }
    55% { transform: scaleX(-1) translateY(-34px) scale(.94, 1.08) }
    85% { transform: scaleX(-1) translateY(0) scale(1.08, .92) }
    100% { transform: scaleX(-1) translateY(0) }
}
@keyframes bocadillo { from { opacity: 0; transform: translate(-50%, 6px) scale(.8) } }

/* ---------- Canción secreta (3 toques al logo) ---------- */

#logo {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}

#logo.toque { animation: toque .18s ease }
#logo.baila { animation: bailar .5s ease-in-out infinite alternate }

@keyframes toque {
    50% { transform: scale(.94) rotate(-2deg) }
}

@keyframes bailar {
    from { transform: rotate(-6deg) scale(1.02) }
    to { transform: rotate(6deg) scale(1.08) }
}

@keyframes entrar {
    from { opacity: 0; transform: translateY(10px) }
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important }
}
</style>
</head>

<body>
<main>

    <header class="marca">
        <img id="logo" src="./logo.png" alt="" width="880" height="375" draggable="false">
        <h1>Cosas de Casa</h1>
        <p id="saludo" class="saludo">&nbsp;</p>
    </header>

    <nav class="apps" aria-label="Aplicaciones">
        <a id="linkLista" class="app" href="#">
            <img src="./lista.png" alt="">
            <span class="app-texto">
                <strong>Lista de la compra</strong>
                <span>Lo que falta en casa</span>
            </span>
            <span class="flecha" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
        </a>

        <a id="linkAgenda" class="app" href="#">
            <img src="./agenda.png" alt="">
            <span class="app-texto">
                <strong>Agenda</strong>
                <span>Citas y planes de todos</span>
            </span>
            <span class="flecha" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
        </a>
        <a class="app app-juego" href="./juego.html">
            <span id="iconoJuego" class="icono-juego" aria-hidden="true"></span>
            <span class="app-texto">
                <strong>Corre por casa</strong>
                <span>Minijuego para echar el rato</span>
            </span>
            <span class="flecha" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </span>
        </a>
    </nav>

</main>

<div id="paseo" class="paseo" aria-hidden="true"></div>

<script src="personajes.js"></script>

<script>
// Direcciones de las dos apps en Vercel
const APPS = {
    lista: "https://lista-compra-atva.vercel.app",
    agenda: "https://agenda-hazel-mu.vercel.app"
};

document.getElementById("linkLista").href = APPS.lista;
document.getElementById("linkAgenda").href = APPS.agenda;

// Saludo según la hora + la fecha de hoy
const ahora = new Date();
const h = ahora.getHours();
const saludo = h >= 6 && h < 14 ? "buenos días" : h >= 14 && h < 21 ? "buenas tardes" : "buenas noches";
const fecha = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" }).format(ahora);
document.getElementById("saludo").textContent = `${saludo} · ${fecha}`;

/* ---------- Muñecos que pasean ---------- */

// Icono del minijuego: uno de la familia al azar, corriendo
document.getElementById("iconoJuego").innerHTML =
    dibujo(FAMILIA[Math.floor(Math.random() * FAMILIA.length)], { piernaA: 24, piernaB: -24 });

const paseo = document.getElementById("paseo");
const quieto = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const ANCHO = 60;

const munyecos = FAMILIA.map((p, i) => {
    const el = document.createElement("button");
    el.className = "munyeco";
    el.setAttribute("aria-label", p.nombre);
    el.innerHTML = dibujo(p);
    paseo.appendChild(el);

    const m = {
        ...p, el,
        x: 0,
        dir: Math.random() < .5 ? 1 : -1,
        vel: p.vel + Math.random() * 6,        // píxeles por segundo
        hasta: 0,                               // cuándo cambia de andar/parar
        anda: true,
        ocupado: 0                              // tiempo parado tras saltar
    };

    el.addEventListener("click", () => {
        saludar(m);
        // Secretos: 3 toques seguidos a Dani, Macu o Diego abren su minijuego
        const SECRETOS = { Daniel: "./botella.html", Macu: "./punto.html", Diego: "./arlo.html" };
        if (!SECRETOS[m.nombre]) return;
        const ahora = performance.now();
        m.toques = ahora - (m.ultimoToque || 0) < 1200 ? (m.toques || 0) + 1 : 1;
        m.ultimoToque = ahora;
        if (m.toques >= 3) {
            m.toques = 0;
            setTimeout(() => { location.href = SECRETOS[m.nombre]; }, 450);
        }
    });
    return m;
});

function colocar(m) {
    m.el.style.transform = `translateX(${m.x}px)`;
    m.el.classList.toggle("izq", m.dir < 0);
    m.el.classList.toggle("anda", m.anda && !quieto);
}

function saludar(m) {
    m.el.classList.remove("salta");
    void m.el.offsetWidth;                      // reinicia la animación
    m.el.classList.add("salta");

    m.el.querySelector(".bocadillo")?.remove();
    const b = document.createElement("span");
    b.className = "bocadillo";
    b.textContent = m.frase;
    m.el.appendChild(b);

    // Que el bocadillo no se salga por los lados; el piquito sigue apuntando al muñeco
    const w = b.offsetWidth;
    const centro = m.x + ANCHO / 2;
    const ok = Math.min(Math.max(centro, 8 + w / 2), paseo.clientWidth - 8 - w / 2);
    b.style.left = `${ok - m.x}px`;
    b.style.setProperty("--pico", `${w / 2 + (centro - ok)}px`);

    // Si choca con otro bocadillo, se pone más arriba
    const alto = 92;
    for (let nivel = 0; nivel < 4; nivel++) {
        b.style.bottom = `${alto + nivel * 44}px`;
        const r = b.getBoundingClientRect();
        const choca = [...paseo.querySelectorAll(".bocadillo")].some(o => {
            if (o === b) return false;
            const q = o.getBoundingClientRect();
            return r.left < q.right + 4 && r.right > q.left - 4 && r.top < q.bottom + 4 && r.bottom > q.top - 4;
        });
        if (!choca) break;
    }

    m.anda = false;
    m.ocupado = 2.6;
    colocar(m);

    clearTimeout(m.tBocadillo);
    m.tBocadillo = setTimeout(() => b.remove(), 2600);
    setTimeout(() => m.el.classList.remove("salta"), 600);
}

function repartir() {
    const libre = Math.max(0, paseo.clientWidth - 32 - ANCHO);
    munyecos.forEach((m, i) => {
        m.x = 16 + (libre / (munyecos.length - 1 || 1)) * i;
        colocar(m);
    });
}

repartir();

if (!quieto) {
    let antes = performance.now();

    function paso(ahora) {
        const dt = Math.min(.05, (ahora - antes) / 1000);
        antes = ahora;
        const min = 16, max = paseo.clientWidth - 16 - ANCHO;

        munyecos.forEach(m => {
            if (m.ocupado > 0) {
                m.ocupado -= dt;
                if (m.ocupado <= 0) { m.anda = true; m.hasta = ahora + 2000 + Math.random() * 4000; }
                return;
            }

            // De vez en cuando se paran un rato, o se dan la vuelta
            if (ahora > m.hasta) {
                m.anda = !m.anda || Math.random() < .3;
                if (m.anda && Math.random() < .4) m.dir *= -1;
                m.hasta = ahora + (m.anda ? 2500 + Math.random() * 5000 : 900 + Math.random() * 2200);
            }

            if (m.anda) {
                m.x += m.dir * m.vel * dt;
                if (m.x < min) { m.x = min; m.dir = 1; }
                if (m.x > max) { m.x = max; m.dir = -1; }
            }

            colocar(m);
        });

        requestAnimationFrame(paso);
    }

    requestAnimationFrame(paso);
}

window.addEventListener("resize", repartir);

/* ---------- Canción secreta: 3 toques seguidos al logo ---------- */

const logo = document.getElementById("logo");
let toques = 0, ultimoToque = 0, cancion = null, baile = null;

function brincar(m) {
    m.el.classList.remove("salta");
    void m.el.offsetWidth;
    m.el.classList.add("salta");
    setTimeout(() => m.el.classList.remove("salta"), 600);
}

function pararCancion() {
    if (cancion) { cancion.pause(); cancion.currentTime = 0; }
    logo.classList.remove("baila");
    clearInterval(baile);
    baile = null;
}

function sonarCancion() {
    if (!cancion) {
        cancion = new Audio("./Cancion.mp3");
        cancion.addEventListener("ended", pararCancion);
    }
    cancion.currentTime = 0;
    cancion.play().then(() => {
        logo.classList.add("baila");
        // los cuatro bailan mientras suena
        baile = setInterval(() => brincar(munyecos[Math.floor(Math.random() * munyecos.length)]), 380);
    }).catch(() => {
        // todavía no hay canción subida
        const m = munyecos[Math.floor(Math.random() * munyecos.length)];
        const frase = m.frase;
        m.frase = "Aún no hay canción…";
        saludar(m);
        m.frase = frase;
    });
}

logo.addEventListener("click", () => {
    if (baile) { pararCancion(); toques = 0; return; }

    const ahora = performance.now();
    toques = ahora - ultimoToque < 1200 ? toques + 1 : 1;
    ultimoToque = ahora;

    logo.classList.remove("toque");
    void logo.offsetWidth;
    logo.classList.add("toque");

    if (toques >= 3) {
        toques = 0;
        sonarCancion();
    }
});

</script>

</body>
</html>
